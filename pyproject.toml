[project]
name = "anki-analysis"
version = "0.1.0"
description = "Interactive Plotly Dash dashboard for analysing Anki flashcard reviews on FSRS-enabled decks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "zstandard>=0.25.0",
    "pandas>=3.0.3",
    "dash>=4.4.0",
    "plotly>=6.9.0",
    "fsrs>=6.3.1",
    "dash-dynamic-grid-layout>=0.1.3",
    "pywebview>=6.2.1",
    "anki>=26.9.3",
]

[tool.uv]
package = false
